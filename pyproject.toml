[project]
name = "vault-mcp-server"
version = "1.0.0"
description = "MCP Server for Vault"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Matthew Schuchard"}]
maintainers = [{name = "Matthew Schuchard"}]
license = {file = "LICENSE"}
keywords = ["mcp", "vault", "server"]
dependencies = [
    "hvac>=2.4.0,<3.0.0",
    "fastmcp>=4.1.0,<4.2.0",
]

[project.urls]
Repository = "https://github.com/mschuchard/vault-mcp-server"
Documentation = "https://github.com/mschuchard/vault-mcp-server"
Issues = "https://github.com/mschuchard/vault-mcp-server/issues"

[tool.ty.rules]
missing-attribute = "ignore"

[tool.ruff.lint]
ignore = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# fixtures are currently synchronous; pin the scope to the value future pytest-asyncio versions will default to
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # hvac KvV2.patch internally calls read_secret_version without raise_on_deleted_version
    "ignore:The raise_on_deleted_version parameter will change its default value:DeprecationWarning:hvac.api.secrets_engines.kv_v2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
vault-mcp-server = "vault_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"